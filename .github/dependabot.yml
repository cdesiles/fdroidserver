# Weekly pull requests for the base image digest and the Python pins, monthly
# for the actions. CI builds and checks each one, and auto-merge.yml merges
# those that pass. fdroidserver has pull requests of its own: a new minor or
# major release waits there for a review, without holding the other pins.
# requirements.txt comes from pip-compile, which Dependabot runs again on
# requirements.in: the pins move together, within what fdroidserver accepts.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements.in lists fdroidserver alone: the rest of requirements.txt
    # is indirect, which Dependabot leaves alone by default
    allow:
      - dependency-type: all
    groups:
      python:
        patterns: ["*"]
        exclude-patterns: [fdroidserver]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
